<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Number Guessing Game</title>
<style>
  :root {
    --bg: #eef3f8; --card: #ffffff; --text: #14213d; --muted: #5c6b80;
    --accent: #2563eb; --low: #d97706; --high: #7c3aed; --win: #059669; --line: #d5dde8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f172a; --card: #1b2540; --text: #e8edf7; --muted: #94a3b8;
            --accent: #60a5fa; --low: #fbbf24; --high: #c4b5fd; --win: #34d399; --line: #2c3a5c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--bg); color: var(--text); font-family: Georgia, "Times New Roman", serif; }
  main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line);
         border-radius: 16px; padding: 28px; }
  h1 { margin: 0 0 6px; font-size: 1.7rem; }
  p.sub { margin: 0 0 22px; color: var(--muted); }
  .row { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 12px; font-size: 1.1rem; border: 1px solid var(--line);
          border-radius: 10px; background: transparent; color: var(--text); }
  button { padding: 12px 18px; font-size: 1rem; border: 0; border-radius: 10px; cursor: pointer;
           background: var(--accent); color: #fff; font-family: inherit; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #msg { min-height: 2.2em; margin: 18px 0 8px; font-size: 1.25rem; font-weight: bold; }
  .low { color: var(--low); } .high { color: var(--high); } .win { color: var(--win); } .err { color: var(--muted); }
  #meta { display: flex; justify-content: space-between; color: var(--muted); font-size: .95rem; }
  #history { margin: 14px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
  #history li { padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: .9rem; }
  .bit { position: fixed; top: -30px; font-size: 1.6rem; pointer-events: none; animation: fall 2.6s ease-in forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); opacity: .6; } }
  #again { display: none; margin-top: 16px; width: 100%; }
</style>
</head>
<body>
<main>
  <h1>Guess the number</h1>
  <p class="sub">I'm thinking of a number from 1 to 100.</p>

  <div class="row">
    <input id="guess" type="number" min="1" max="100" inputmode="numeric" placeholder="Your guess" aria-label="Your guess">
    <button id="go">Guess</button>
  </div>

  <div id="msg" role="status" aria-live="polite"></div>
  <div id="meta"><span>Tries: <b id="tries">0</b></span><span>Best: <b id="best">–</b></span></div>
  <ul id="history"></ul>
  <button id="again" class="ghost">Play again</button>
</main>

<script>
  let secret, tries, over;
  const $ = id => document.getElementById(id);
  let best = null;
  try { best = localStorage.getItem("best"); } catch (e) {}
  if (best) $("best").textContent = best;

  function newGame() {
    secret = Math.floor(Math.random() * 100) + 1;  // same as random.randint(1, 100)
    tries = 0; over = false;
    $("tries").textContent = 0;
    $("msg").textContent = ""; $("msg").className = "";
    $("history").innerHTML = "";
    $("again").style.display = "none";
    $("guess").value = ""; $("guess").disabled = false; $("go").disabled = false;
    $("guess").focus();
  }

  function greeting(t) {
    if (t === 1) return "🎉 Unbelievable! First try!";
    if (t <= 5) return "🎉 Congratulations! You're a mind reader!";
    if (t <= 8) return "👏 Congratulations! Great guessing!";
    return "💪 Congratulations! You did it. Try for fewer tries next time!";
  }

  function confetti() {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const bits = ["🎉", "✨", "🎊", "⭐"];
    for (let i = 0; i < 24; i++) {
      const s = document.createElement("span");
      s.className = "bit";
      s.textContent = bits[i % bits.length];
      s.style.left = Math.random() * 100 + "vw";
      s.style.animationDelay = Math.random() * 0.8 + "s";
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 3500);
    }
  }

  function say(text, cls) { $("msg").textContent = text; $("msg").className = cls; }

  function check() {
    if (over) return;
    const g = parseInt($("guess").value, 10);
    if (isNaN(g) || g < 1 || g > 100) { say("Enter a whole number from 1 to 100.", "err"); return; }

    tries++;
    $("tries").textContent = tries;
    const li = document.createElement("li");
    li.textContent = g;
    $("history").appendChild(li);

    if (g < secret) say("Too low!", "low");
    else if (g > secret) say("Too high!", "high");
    else {
      say(greeting(tries) + " You got it in " + tries + (tries === 1 ? " try." : " tries."), "win");
      confetti();
      over = true;
      $("guess").disabled = true; $("go").disabled = true;
      $("again").style.display = "block"; $("again").focus();
      if (best === null || tries < Number(best)) {
        best = String(tries); $("best").textContent = best;
        try { localStorage.setItem("best", best); } catch (e) {}
      }
      return;
    }
    $("guess").value = ""; $("guess").focus();
  }

  $("go").addEventListener("click", check);
  $("guess").addEventListener("keydown", e => { if (e.key === "Enter") check(); });
  $("again").addEventListener("click", newGame);
  newGame();
</script>
</body>
</html>
